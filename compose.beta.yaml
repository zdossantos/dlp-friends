x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE must be a published image digest}
  networks:
    default: {}
  environment: &app-environment
    APP_NAME: DLP Friends
    APP_ENV: beta
    APP_KEY: ${BETA_APP_KEY:?APP_KEY is required}
    APP_DEBUG: "false"
    APP_URL: https://beta.dlp-friends.fr
    LEGAL_CONTACT_EMAIL: ${BETA_LEGAL_CONTACT_EMAIL:?LEGAL_CONTACT_EMAIL is required}
    APP_LOCALE: fr
    APP_FALLBACK_LOCALE: fr
    APP_MAINTENANCE_DRIVER: cache
    APP_MAINTENANCE_STORE: redis
    CACHE_PREFIX: dlp_friends_beta_cache_
    REDIS_PREFIX: dlp_friends_beta_
    REDIS_DB: 0
    REDIS_CACHE_DB: 1
    LOG_CHANNEL: stack
    LOG_STACK: single
    LOG_LEVEL: ${BETA_LOG_LEVEL:-warning}
    DB_CONNECTION: mysql
    DB_HOST: ${BETA_DB_HOST:?DB_HOST is required}
    DB_PORT: ${BETA_DB_PORT:-3306}
    DB_CHARSET: ${BETA_DB_CHARSET:-utf8mb4}
    DB_COLLATION: ${BETA_DB_COLLATION:-utf8mb4_unicode_ci}
    DB_DATABASE: ${BETA_DB_DATABASE:?DB_DATABASE is required}
    DB_USERNAME: ${BETA_DB_USERNAME:?DB_USERNAME is required}
    DB_PASSWORD: ${BETA_DB_PASSWORD:?DB_PASSWORD is required}
    SESSION_DOMAIN: ""
    SESSION_COOKIE: dlp_friends_beta_session
    SESSION_DRIVER: redis
    SESSION_ENCRYPT: "true"
    SESSION_SECURE_COOKIE: "true"
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    QUEUE_WORKER_MEMORY: 96
    REDIS_CLIENT: phpredis
    REDIS_HOST: ${BETA_REDIS_HOST:?REDIS_HOST is required}
    REDIS_PASSWORD: ${BETA_REDIS_PASSWORD:?REDIS_PASSWORD is required}
    REDIS_PORT: ${BETA_REDIS_PORT:-6379}
    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: ${BETA_REVERB_APP_ID:?REVERB_APP_ID is required}
    REVERB_APP_KEY: ${BETA_REVERB_APP_KEY:?REVERB_APP_KEY is required}
    REVERB_APP_SECRET: ${BETA_REVERB_APP_SECRET:?REVERB_APP_SECRET is required}
    REVERB_HOST: dlp-friends-beta-reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    FILESYSTEM_DISK: s3
    AWS_ACCESS_KEY_ID: ${BETA_AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
    AWS_SECRET_ACCESS_KEY: ${BETA_AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
    AWS_DEFAULT_REGION: ${BETA_AWS_DEFAULT_REGION:-us-east-1}
    AWS_BUCKET: ${BETA_AWS_BUCKET:?AWS_BUCKET is required}
    AWS_ENDPOINT: ${BETA_AWS_ENDPOINT:?AWS_ENDPOINT is required}
    AWS_USE_PATH_STYLE_ENDPOINT: "true"
    MAIL_MAILER: smtp
    MAIL_HOST: ${BETA_MAILPIT_HOST:?MAILPIT_HOST is required}
    BETA_MAILPIT_HOST: ${BETA_MAILPIT_HOST:?MAILPIT_HOST is required}
    MAIL_PORT: 1025
    MAIL_SCHEME: smtp
    MAIL_USERNAME: ""
    MAIL_PASSWORD: ""
    MAIL_URL: ""
    MAIL_FROM_ADDRESS: beta@dlp-friends.fr
    MAIL_FROM_NAME: DLP Friends Beta
    GOOGLE_CLIENT_ID: ${BETA_GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${BETA_GOOGLE_CLIENT_SECRET:-}
    GOOGLE_REDIRECT_URI: https://beta.dlp-friends.fr/auth/google/callback
    VAPID_SUBJECT: ${BETA_VAPID_SUBJECT:?VAPID_SUBJECT is required}
    VAPID_PUBLIC_KEY: ${BETA_VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY is required}
    VAPID_PRIVATE_KEY: ${BETA_VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY is required}
  restart: unless-stopped

services:
  web:
    <<: *app
    command: web
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 192M

  worker:
    <<: *app
    command: worker
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M

  scheduler:
    <<: *app
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 80M

  reverb:
    <<: *app
    command: reverb
    networks:
      default:
        aliases:
          - dlp-friends-beta-reverb
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - '$$socket = @fsockopen("127.0.0.1", 8080); exit($$socket ? 0 : 1);'
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 80M
