name: CI

on:
  pull_request:
    branches:
      - main
      - release/1.14
      - release/1.16
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP quality
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Check PHP formatting
        run: composer lint:check
      - name: Run static analysis
        run: composer analyse

  pest-prepare:
    name: Prepare Pest tests
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-
      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install Bun dependencies
        run: bun install --frozen-lockfile
      - name: Generate Wayfinder modules
        run: php artisan wayfinder:generate --with-form
      - name: Build Vite assets
        run: bun run build
      - name: Install Playwright Chromium
        run: bunx playwright install chromium
      - name: Cache prepared Pest workspace
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor
            node_modules
            public/build
            public/service-worker.js
            resources/js/actions
            resources/js/routes
            resources/js/wayfinder
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-pest-workspace-${{ github.sha }}

  pest-tests:
    name: Pest backend (shard ${{ matrix.shard }}/4)
    if: github.event.pull_request.draft == false
    needs: pest-prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_DATABASE: dlp_friends_test
          MYSQL_USER: dlp_friends
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: test-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: dlp_friends_test
      DB_USERNAME: dlp_friends
      DB_PASSWORD: test-only-password
      MAIL_MAILER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Restore prepared Pest workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor
            node_modules
            public/build
            public/service-worker.js
            resources/js/actions
            resources/js/routes
            resources/js/wayfinder
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-pest-workspace-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Verify test database driver
        run: php tests/Support/verify-test-database.php
      - name: Run database migrations
        run: php artisan migrate --force
      - name: Run Pest
        run: ./vendor/bin/pest tests/Feature tests/Unit --shard=${{ matrix.shard }}/4 --display-warnings
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pest-backend-${{ matrix.shard }}
          path: |
            storage/logs
            test-results
          retention-days: 7
          if-no-files-found: ignore

  pest-browser-tests:
    name: Pest browser (shard ${{ matrix.shard }}/4)
    if: github.event.pull_request.draft == false
    needs: pest-prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_DATABASE: dlp_friends_test
          MYSQL_USER: dlp_friends
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: test-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: dlp_friends_test
      DB_USERNAME: dlp_friends
      DB_PASSWORD: test-only-password
      MAIL_MAILER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Restore prepared Pest workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor
            node_modules
            public/build
            public/service-worker.js
            resources/js/actions
            resources/js/routes
            resources/js/wayfinder
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-pest-workspace-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Verify test database driver
        run: php tests/Support/verify-test-database.php
      - name: Run database migrations
        run: php artisan migrate --force
      - name: Install Playwright system dependencies
        run: ./node_modules/.bin/playwright install-deps chromium
      - name: Run Pest
        run: ./vendor/bin/pest tests/Browser --shard=${{ matrix.shard }}/4 --display-warnings
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pest-browser-${{ matrix.shard }}
          path: |
            tests/Browser/Screenshots
            test-results
            storage/logs
          retention-days: 7
          if-no-files-found: ignore

  pest-realtime-tests:
    name: Pest realtime (Reverb)
    if: github.event.pull_request.draft == false
    needs: pest-prepare
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_DATABASE: dlp_friends_test
          MYSQL_USER: dlp_friends
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: test-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: dlp_friends_test
      DB_USERNAME: dlp_friends
      DB_PASSWORD: test-only-password
      MAIL_MAILER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      REALTIME_BROWSER_TESTS: 'true'
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ci-realtime
      REVERB_APP_KEY: ci-realtime-public-key
      REVERB_APP_SECRET: ci-realtime-test-only-secret
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: 18081
      REVERB_SCHEME: http
      VITE_REVERB_APP_KEY: ci-realtime-public-key
      VITE_REVERB_HOST: 127.0.0.1
      VITE_REVERB_PORT: 18081
      VITE_REVERB_SCHEME: http
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Restore prepared Pest workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor
            node_modules
            public/build
            public/service-worker.js
            resources/js/actions
            resources/js/routes
            resources/js/wayfinder
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-pest-workspace-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Verify test database driver
        run: php tests/Support/verify-test-database.php
      - name: Run database migrations
        run: php artisan migrate --force
      - name: Install Playwright system dependencies
        run: ./node_modules/.bin/playwright install-deps chromium
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Build realtime browser assets
        run: bun run build
      - name: Run realtime browser journeys
        run: bash .github/scripts/test-realtime.sh
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pest-realtime
          path: |
            tests/Browser/Screenshots
            test-results
            storage/logs
          retention-days: 7
          if-no-files-found: ignore

  pest-tests-result:
    name: Backend tests
    if: always() && github.event.pull_request.draft == false
    needs: [pest-tests, pest-browser-tests, pest-realtime-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Pest shard
        env:
          PEST_BACKEND_RESULT: ${{ needs.pest-tests.result }}
          PEST_BROWSER_RESULT: ${{ needs.pest-browser-tests.result }}
          PEST_REALTIME_RESULT: ${{ needs.pest-realtime-tests.result }}
        run: test "$PEST_BACKEND_RESULT" = success && test "$PEST_BROWSER_RESULT" = success && test "$PEST_REALTIME_RESULT" = success

  frontend-quality:
    name: Frontend quality
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install Bun dependencies
        run: bun install --frozen-lockfile
      - name: Generate Wayfinder modules
        run: php artisan wayfinder:generate --with-form
      - name: Check frontend lint
        run: bun run lint:check
      - name: Check frontend formatting
        run: bun run format:check
      - name: Check TypeScript
        run: bun run types:check
      - name: Run frontend unit tests
        run: bun run test:unit
  vite-build:
    name: Vite build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install Bun dependencies
        run: bun install --frozen-lockfile
      - name: Build Vite assets
        run: bun run build

  docker-build:
    name: Docker build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: dlp-friends:ci
          build-args: |
            VITE_REVERB_APP_KEY=ci-public-key
            VITE_REVERB_HOST=reverb.example.test
            VITE_REVERB_PORT=443
            VITE_REVERB_SCHEME=https
          cache-from: type=gha,scope=runtime-image
          cache-to: type=gha,mode=max,scope=runtime-image
      - name: Smoke test runtime image
        run: bash .github/scripts/smoke-image.sh dlp-friends:ci
      - name: Test real maintenance and HTTP drainage
        run: python3 tests/Support/operations/runtime_integration.py dlp-friends:ci
      - name: Test rolling shutdown and shared assets
        run: |
          python3 tests/Support/operations/rolling_runtime.py dlp-friends:ci
          python3 tests/Support/operations/rolling_assets.py dlp-friends:ci
