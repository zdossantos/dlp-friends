      }

&lt;/style&gt;
&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;dlp-preview&#x27;),app=root.querySelector(&#x27;#dlp-app&#x27;),modal=root.querySelector(&#x27;#dlp-modal&#x27;),modalContent=root.querySelector(&#x27;#dlp-modal-content&#x27;);
const icon=name=&gt;`&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
const labels={hidden:&#x27;Personne&#x27;,matches:&#x27;Mes matchs&#x27;,members:&#x27;Tous les membres&#x27;};
const saved=window.openai?.widgetState?.privateContent;
const state={version:&#x27;busy-day&#x27;,tab:&#x27;visits&#x27;,screen:&#x27;home&#x27;,view:&#x27;calendar&#x27;,audience:&#x27;all&#x27;,search:&#x27;&#x27;,visibility:&#x27;hidden&#x27;,selectedDay:24,visits:[{start:&#x27;2026-10-23&#x27;,end:&#x27;2026-10-25&#x27;}],requested:false,ownTrip:null,messages:[],...(saved?.version===&#x27;busy-day&#x27;?saved:{})};
const people=[{name:&#x27;Camille&#x27;,initials:&#x27;CA&#x27;,match:true,days:[23,24,25],note:&#x27;Du 23 au 25 octobre · 3 jours&#x27;},{name:&#x27;Thomas&#x27;,initials:&#x27;TH&#x27;,match:true,days:[23],note:&#x27;Le 23 octobre · Journée&#x27;},{name:&#x27;Léa&#x27;,initials:&#x27;LÉ&#x27;,match:false,days:[24,25],note:&#x27;Les 24 et 25 octobre · 2 jours&#x27;},{name:&#x27;Alex&#x27;,initials:&#x27;AL&#x27;,match:true,days:[31],note:&#x27;Le 31 octobre · Journée&#x27;}];
const extraNames=[&#x27;Juliette&#x27;,&#x27;Maxime&#x27;,&#x27;Sarah&#x27;,&#x27;Hugo&#x27;,&#x27;Inès&#x27;,&#x27;Lucas&#x27;,&#x27;Emma&#x27;,&#x27;Nathan&#x27;,&#x27;Chloé&#x27;,&#x27;Louis&#x27;,&#x27;Manon&#x27;,&#x27;Arthur&#x27;,&#x27;Jade&#x27;,&#x27;Gabriel&#x27;,&#x27;Louise&#x27;,&#x27;Adam&#x27;,&#x27;Alice&#x27;,&#x27;Paul&#x27;,&#x27;Zoé&#x27;,&#x27;Antoine&#x27;,&#x27;Clara&#x27;,&#x27;Raphaël&#x27;];
people.push(...extraNames.map((name,i)=&gt;({name,initials:name.slice(0,2).toUpperCase(),match:i&lt;10,days:[24],note:&#x27;Le 24 octobre · Journée&#x27;})));
let confirmAction=null;
const escape=s=&gt;String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
const normalize=s=&gt;s.normalize(&#x27;NFD&#x27;).replace(/[\u0300-\u036f]/g,&#x27;&#x27;).toLowerCase();
function persist(){window.openai?.setWidgetState?.({modelContent:{feature:state.tab,view:state.view,visitVisibility:state.visibility},privateContent:state})?.catch(()=&gt;{});}
function icons(){globalThis.lucide?.createIcons({attrs:{width:20,height:20}});}
function notice(text){root.querySelector(&#x27;#dlp-notice&#x27;).textContent=text;}
function confirmSharing(kind,onConfirm,onCancel=()=&gt;{}){confirmAction=onConfirm;modalContent.innerHTML=`&lt;span class=&quot;dlp-label&quot;&gt;${icon(&#x27;users&#x27;)} Tous les membres&lt;/span&gt;&lt;h2 id=&quot;dlp-modal-title&quot; style=&quot;margin-top:14px&quot;&gt;Partager ${kind===&#x27;visits&#x27;?&#x27;tes dates de visite&#x27;:&#x27;ce trajet&#x27;} avec tous les membres ?&lt;/h2&gt;&lt;p&gt;${kind===&#x27;visits&#x27;?&#x27;Tous les membres connectés pourront consulter tes visites déjà renseignées et celles que tu ajouteras. Tu pourras modifier ce choix à tout moment.&#x27;:&#x27;Tous les membres connectés pourront voir cette proposition. Le rendez-vous précis et la discussion resteront réservés aux participants acceptés.&#x27;}&lt;/p&gt;&lt;div class=&quot;dlp-stack&quot;&gt;&lt;button class=&quot;dlp-button dlp-primary&quot; data-action=&quot;confirm&quot;&gt;Partager avec tous les membres&lt;/button&gt;&lt;button class=&quot;dlp-button&quot; data-action=&quot;cancel-confirm&quot;&gt;Annuler&lt;/button&gt;&lt;/div&gt;`;modal.oncancel=()=&gt;{onCancel();confirmAction=null};modal._cancel=onCancel;icons();modal.showModal();}
function heading(title,back=&#x27;home&#x27;){return `&lt;div class=&quot;dlp-panel-head&quot;&gt;&lt;button class=&quot;dlp-back&quot; data-action=&quot;back&quot; data-target=&quot;${back}&quot; aria-label=&quot;Retour&quot;&gt;${icon(&#x27;arrow-left&#x27;)}&lt;/button&gt;&lt;h1&gt;${title}&lt;/h1&gt;&lt;/div&gt;`;}
function bottom(){return `&lt;nav class=&quot;dlp-bottom&quot; aria-label=&quot;Navigation principale&quot;&gt;${[[&#x27;sparkles&#x27;,&#x27;Découvrir&#x27;,&#x27;discovery&#x27;],[&#x27;message-circle&#x27;,&#x27;Échanges&#x27;,&#x27;messages&#x27;],[&#x27;calendar-days&#x27;,&#x27;Sorties&#x27;,&#x27;outings&#x27;],[&#x27;bell&#x27;,&#x27;Alertes&#x27;,&#x27;alerts&#x27;],[&#x27;user-round&#x27;,&#x27;Profil&#x27;,&#x27;profile&#x27;]].map(([i,t,a])=&gt;`&lt;button data-action=&quot;nav&quot; data-target=&quot;${a}&quot; aria-pressed=&quot;${a===&#x27;outings&#x27;}&quot;&gt;${icon(i)}${t}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/nav&gt;`;}
function matches(){return people.filter(p=&gt;(state.audience===&#x27;all&#x27;||p.match)&amp;&amp;normalize(p.name).includes(normalize(state.search)));}
function isoDay(day){return typeof day===&#x27;number&#x27;?`2026-10-${String(day).padStart(2,&#x27;0&#x27;)}`:day;}
function ownOn(day){const key=isoDay(day);return state.visits.some(v=&gt;v.start&lt;=key&amp;&amp;v.end&gt;=key);}
function personRow(p){return `&lt;div class=&quot;dlp-person&quot;&gt;&lt;span class=&quot;dlp-avatar&quot;&gt;${p.initials}&lt;/span&gt;&lt;div class=&quot;dlp-grow&quot;&gt;&lt;button class=&quot;dlp-person-name&quot; data-action=&quot;person&quot; data-name=&quot;${p.name}&quot;&gt;${p.name}&lt;/button&gt;&lt;div class=&quot;dlp-muted&quot;&gt;${p.note}&lt;/div&gt;&lt;/div&gt;${p.match?&#x27;&lt;span class=&quot;dlp-label&quot;&gt;Match&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;`;}
function dayRows(day,list){
const actual=new Date(isoDay(day)+&#x27;T12:00:00&#x27;);const month=new Intl.DateTimeFormat(&#x27;fr&#x27;,{month:&#x27;short&#x27;}).format(actual);const mine=ownOn(day)&amp;&amp;!state.search;
return `&lt;section aria-label=&quot;Visites du ${actual.getDate()} ${month}&quot;&gt;&lt;div class=&quot;dlp-day&quot;&gt;&lt;span class=&quot;dlp-date&quot;&gt;${actual.getDate()}&lt;small&gt;${month.toUpperCase()}&lt;/small&gt;&lt;/span&gt;&lt;div&gt;&lt;h3&gt;${new Intl.DateTimeFormat(&#x27;fr&#x27;,{weekday:&#x27;long&#x27;}).format(actual)}&lt;/h3&gt;&lt;span class=&quot;dlp-muted&quot;&gt;${mine?&#x27;Tu y seras aussi&#x27;:list.length+&#x27; personne&#x27;+(list.length&gt;1?&#x27;s&#x27;:&#x27;&#x27;)+&#x27; présente&#x27;+(list.length&gt;1?&#x27;s&#x27;:&#x27;&#x27;)}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
${mine?`&lt;div class=&quot;dlp-my-visit&quot;&gt;${icon(&#x27;calendar-check&#x27;)}&lt;div class=&quot;dlp-grow&quot;&gt;&lt;strong&gt;Ta visite&lt;/strong&gt;&lt;div class=&quot;dlp-muted&quot;&gt;${state.visibility===&#x27;hidden&#x27;?&#x27;Toi uniquement&#x27;:`Partagée avec ${labels[state.visibility].toLowerCase()}`}&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;dlp-link&quot; data-action=&quot;edit-visit&quot;&gt;Modifier&lt;/button&gt;&lt;/div&gt;`:&#x27;&#x27;}
${list.length?`&lt;div class=&quot;dlp-others-title&quot;&gt;${icon(&#x27;users&#x27;)} ${mine?&#x27;Également présents&#x27;:&#x27;Membres présents&#x27;} · ${list.length}&lt;/div&gt;${list.slice(0,3).map(personRow).join(&#x27;&#x27;)}${list.length&gt;3?`&lt;button class=&quot;dlp-button dlp-see-members&quot; data-action=&quot;members&quot; data-day=&quot;${isoDay(day)}&quot;&gt;&lt;span&gt;Voir les ${list.length} personnes&lt;/span&gt;${icon(&#x27;chevron-right&#x27;)}&lt;/button&gt;`:&#x27;&#x27;}`:&#x27;&#x27;}&lt;/section&gt;`;
}
function membersScreen(){const date=new Date(state.membersDay+&#x27;T12:00:00&#x27;);const list=matches().filter(p=&gt;p.days.some(d=&gt;isoDay(d)===state.membersDay));return `&lt;main class=&quot;dlp-main&quot;&gt;${heading(&#x27;Les personnes présentes&#x27;)}&lt;h2&gt;${new Intl.DateTimeFormat(&#x27;fr&#x27;,{weekday:&#x27;long&#x27;,day:&#x27;numeric&#x27;,month:&#x27;long&#x27;}).format(date)}&lt;/h2&gt;&lt;p class=&quot;dlp-intro&quot;&gt;${list.length} personne${list.length&gt;1?&#x27;s&#x27;:&#x27;&#x27;} · ${state.audience===&#x27;all&#x27;?&#x27;Tous les membres&#x27;:&#x27;Mes matchs&#x27;}${ownOn(state.membersDay)?&#x27; · en plus de toi&#x27;:&#x27;&#x27;}&lt;/p&gt;${list.map(personRow).join(&#x27;&#x27;)}&lt;/main&gt;`;}
function visitResults(){const filtered=matches();let output=&#x27;&#x27;;if(state.view===&#x27;calendar&#x27;){
output=`&lt;div class=&quot;dlp-calendar&quot; aria-label=&quot;Octobre 2026&quot;&gt;${[&#x27;L&#x27;,&#x27;M&#x27;,&#x27;M&#x27;,&#x27;J&#x27;,&#x27;V&#x27;,&#x27;S&#x27;,&#x27;D&#x27;].map(d=&gt;`&lt;span&gt;${d}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;${Array.from({length:31},(_,i)=&gt;i+1).map(d=&gt;{const count=filtered.filter(p=&gt;p.days.includes(d)).length;const mine=ownOn(d);return `&lt;button data-action=&quot;day&quot; data-day=&quot;${d}&quot; aria-label=&quot;${d} octobre${mine?&#x27;, ta visite&#x27;:&#x27;&#x27;}, ${count} autre${count&gt;1?&#x27;s&#x27;:&#x27;&#x27;} membre${count&gt;1?&#x27;s&#x27;:&#x27;&#x27;}&quot; aria-pressed=&quot;${state.selectedDay===d}&quot;&gt;&lt;span&gt;${d}&lt;/span&gt;${mine?&#x27;&lt;span class=&quot;dlp-cell-own&quot;&gt;Toi&lt;/span&gt;&#x27;:&#x27;&#x27;}${count?`&lt;span class=&quot;dlp-cell-count&quot;&gt;${icon(&#x27;users&#x27;)}${count&gt;99?&#x27;99+&#x27;:count}&lt;/span&gt;`:&#x27;&#x27;}&lt;/button&gt;`}).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;dlp-calendar-legend&quot;&gt;&lt;span class=&quot;dlp-legend-own&quot;&gt;Toi · ta visite&lt;/span&gt;&lt;span&gt;${icon(&#x27;users&#x27;)} Autres membres présents&lt;/span&gt;&lt;/div&gt;`;
const list=filtered.filter(p=&gt;p.days.includes(state.selectedDay));return output+dayRows(state.selectedDay,list)+(list.length===0&amp;&amp;!ownOn(state.selectedDay)?&#x27;&lt;p class=&quot;dlp-empty&quot;&gt;Aucune visite partagée ce jour.&lt;/p&gt;&#x27;:&#x27;&#x27;);}
const dateKeys=new Set([&#x27;2026-10-23&#x27;,&#x27;2026-10-24&#x27;,&#x27;2026-10-25&#x27;,&#x27;2026-10-31&#x27;]);for(const v of state.visits){let date=new Date(v.start+&#x27;T12:00:00&#x27;);const end=new Date(v.end+&#x27;T12:00:00&#x27;);let limit=0;while(date&lt;=end&amp;&amp;limit++&lt;366){dateKeys.add(`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,&#x27;0&#x27;)}-${String(date.getDate()).padStart(2,&#x27;0&#x27;)}`);date.setDate(date.getDate()+1)}}for(const d of [...dateKeys].sort()){const list=filtered.filter(p=&gt;p.days.some(day=&gt;isoDay(day)===d));if(list.length||(!state.search&amp;&amp;ownOn(d)))output+=dayRows(d,list);}return output||&#x27;&lt;p class=&quot;dlp-empty&quot;&gt;Aucune visite partagée à venir pour cette recherche.&lt;/p&gt;&#x27;;}
function home(){return `&lt;main class=&quot;dlp-main&quot;&gt;&lt;div class=&quot;dlp-top&quot;&gt;&lt;div&gt;&lt;h1&gt;On y va ensemble ?&lt;/h1&gt;&lt;p class=&quot;dlp-intro&quot;&gt;Tes prochaines sorties, entre amis.&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;dlp-icon&quot; data-action=&quot;settings&quot; aria-label=&quot;Visibilité de mes visites&quot;&gt;${icon(&#x27;settings-2&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;dlp-tabs&quot; aria-label=&quot;Type de sortie&quot;&gt;${[[&#x27;events&#x27;,&#x27;Événements&#x27;],[&#x27;visits&#x27;,&#x27;Visites&#x27;],[&#x27;trips&#x27;,&#x27;Trajets&#x27;]].map(([v,t])=&gt;`&lt;button data-action=&quot;tab&quot; data-tab=&quot;${v}&quot; aria-pressed=&quot;${state.tab===v}&quot;&gt;${t}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${state.tab===&#x27;visits&#x27;?visitsHome():state.tab===&#x27;trips&#x27;?tripsHome():eventsHome()}&lt;/main&gt;${bottom()}`;}
function visitsHome(){return `&lt;div class=&quot;dlp-row dlp-between&quot;&gt;&lt;h2&gt;Prochaines visites&lt;/h2&gt;&lt;button class=&quot;dlp-button dlp-primary&quot; data-action=&quot;add-visit&quot;&gt;${icon(&#x27;plus&#x27;)} Ma visite&lt;/button&gt;&lt;/div&gt;&lt;label class=&quot;dlp-search&quot;&gt;${icon(&#x27;search&#x27;)}&lt;input id=&quot;dlp-search&quot; type=&quot;search&quot; placeholder=&quot;Rechercher un prénom ou un nom&quot; aria-label=&quot;Rechercher par nom d’affichage&quot; value=&quot;${escape(state.search)}&quot;&gt;&lt;/label&gt;&lt;div class=&quot;dlp-row dlp-between&quot;&gt;&lt;div class=&quot;dlp-switch&quot; aria-label=&quot;Vue des visites&quot;&gt;&lt;button data-action=&quot;view&quot; data-view=&quot;agenda&quot; aria-pressed=&quot;${state.view===&#x27;agenda&#x27;}&quot;&gt;Agenda&lt;/button&gt;&lt;button data-action=&quot;view&quot; data-view=&quot;calendar&quot; aria-pressed=&quot;${state.view===&#x27;calendar&#x27;}&quot;&gt;Calendrier&lt;/button&gt;&lt;/div&gt;&lt;span class=&quot;dlp-muted&quot;&gt;Octobre 2026&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dlp-filters&quot;&gt;&lt;button class=&quot;dlp-chip&quot; data-action=&quot;audience&quot; data-value=&quot;matches&quot; aria-pressed=&quot;${state.audience===&#x27;matches&#x27;}&quot;&gt;Mes matchs&lt;/button&gt;&lt;button class=&quot;dlp-chip&quot; data-action=&quot;audience&quot; data-value=&quot;all&quot; aria-pressed=&quot;${state.audience===&#x27;all&#x27;}&quot;&gt;Tous les membres&lt;/button&gt;&lt;/div&gt;&lt;div id=&quot;dlp-results&quot;&gt;${visitResults()}&lt;/div&gt;&lt;div class=&quot;dlp-own-note&quot;&gt;${icon(state.visibility===&#x27;hidden&#x27;?&#x27;lock-keyhole&#x27;:&#x27;users&#x27;)} Tes dates : &lt;strong&gt;${labels[state.visibility]}&lt;/strong&gt;&lt;br&gt;&lt;button class=&quot;dlp-link&quot; data-action=&quot;settings&quot;&gt;Gérer la visibilité de mes visites&lt;/button&gt;&lt;/div&gt;`;}
function tripsHome(){return `&lt;div class=&quot;dlp-row dlp-between&quot;&gt;&lt;h2&gt;Voyager ensemble&lt;/h2&gt;&lt;button class=&quot;dlp-button dlp-primary&quot; data-action=&quot;add-trip&quot;&gt;${icon(&#x27;plus&#x27;)} Proposer&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;dlp-intro&quot;&gt;Partage le chemin jusqu’au parc.&lt;/p&gt;${state.ownTrip?`&lt;article class=&quot;dlp-trip&quot;&gt;&lt;span class=&quot;dlp-label dlp-own&quot;&gt;Ton trajet · ${labels[state.ownTrip.visibility]}&lt;/span&gt;&lt;h3 style=&quot;margin-top:12px&quot;&gt;${escape(state.ownTrip.from)} → ${escape(state.ownTrip.to)}&lt;/h3&gt;&lt;p class=&quot;dlp-muted&quot;&gt;${escape(state.ownTrip.date)} · ${escape(state.ownTrip.mode)} · ${escape(state.ownTrip.time)}&lt;/p&gt;&lt;button class=&quot;dlp-link&quot; data-action=&quot;own-trip&quot;&gt;Gérer mon trajet&lt;/button&gt;&lt;/article&gt;`:&#x27;&#x27;}&lt;article class=&quot;dlp-trip&quot;&gt;&lt;button class=&quot;dlp-trip-action&quot; data-action=&quot;trip-detail&quot;&gt;&lt;div class=&quot;dlp-row dlp-between&quot;&gt;&lt;span class=&quot;dlp-label&quot;&gt;${icon(&#x27;train-front&#x27;)} Train · Aller&lt;/span&gt;&lt;span class=&quot;dlp-muted&quot;&gt;Ven. 23 oct.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dlp-route&quot;&gt;&lt;time&gt;08:12&lt;/time&gt;&lt;strong&gt;Lille Europe&lt;/strong&gt;&lt;time&gt;09:17&lt;/time&gt;&lt;span&gt;Marne-la-Vallée – Chessy&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dlp-row&quot;&gt;&lt;span class=&quot;dlp-avatar&quot;&gt;CA&lt;/span&gt;&lt;div class=&quot;dlp-grow&quot;&gt;&lt;strong&gt;Camille&lt;/strong&gt;&lt;div class=&quot;dlp-muted&quot;&gt;Ton match · 2 participants&lt;/div&gt;&lt;/div&gt;${icon(&#x27;chevron-right&#x27;)}&lt;/div&gt;&lt;/button&gt;&lt;/article&gt;&lt;article class=&quot;dlp-trip&quot;&gt;&lt;button class=&quot;dlp-trip-action&quot; data-action=&quot;car-detail&quot;&gt;&lt;div class=&quot;dlp-row dlp-between&quot;&gt;&lt;span class=&quot;dlp-label&quot;&gt;${icon(&#x27;car-front&#x27;)} Voiture · Aller&lt;/span&gt;&lt;span class=&quot;dlp-muted&quot;&gt;Sam. 24 oct.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dlp-route&quot;&gt;&lt;time&gt;07:30&lt;/time&gt;&lt;strong&gt;Reims&lt;/strong&gt;&lt;time&gt;09:00&lt;/time&gt;&lt;span&gt;Disneyland Paris&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dlp-row&quot;&gt;&lt;span class=&quot;dlp-avatar&quot;&gt;LÉ&lt;/span&gt;&lt;div class=&quot;dlp-grow&quot;&gt;&lt;strong&gt;Léa&lt;/strong&gt;&lt;div class=&quot;dlp-muted&quot;&gt;Tous les membres · 2 places libres&lt;/div&gt;&lt;/div&gt;${icon(&#x27;chevron-right&#x27;)}&lt;/div&gt;&lt;/button&gt;&lt;/article&gt;`;}
